spring:
  datasource:
    url: jdbc:mysql://localhost:3306/camunda?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: camunda
  jpa:
    hibernate:
      ddl-auto: update          # 自动建表，生产建议改为 none + Flyway
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

camunda.bpm:
  database:
    schema-update: true
  history-level: full
  eventing:
    enabled: true
    execution: true
    history: true
    task: true
  admin-user:
    id: demo
    password: demo
    firstName: Demo
  filter:
    create: All tasks